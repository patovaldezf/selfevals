# Live sentiment experiment — drives a REAL Claude Opus 4.8 call per case.
#
# Where `example_showcase.yaml` runs fully offline (`sandbox: mock`), this spec
# hits the Anthropic API on every case so you can watch a real trace populate
# live in the web UI. Needs ANTHROPIC_API_KEY in the environment.
#
# Run it with:
#   selfevals run evals/experiments/example_sentiment_live.yaml

# The workspace id below is a fixed placeholder so this example runs with no
# setup — `run` auto-creates it. To use your own: `selfevals init <slug>` prints
# an id; pass it with `--workspace <id>` or edit the key below.
workspace: ws_01HZZZZZZZZZZZZZZZZZZZZZZZ

experiment:
  name: sentiment live
  goal: classify review sentiment with a real Claude call and grade per-case
  mode: handoff
  taxonomy:
    target_features:
      - support.sentiment
    dataset_types:
      - capability
  datasets:
    optimization: { id: ds_sentiment, version: 1 }
  target:
    primary: { name: pass@1, operator: ">=", value: 0.8 }
  editable:
    prompt: true
    model_params: true
  frozen:
    fleet: { id: flt_demo }
    agents:
      - { id: ag_sentiment }
    datasets:
      - { id: ds_sentiment }
  proposer:
    strategy: grid
  search_space:
    model_params:
      variant: [0.0, 1.0]
  run:
    # `mock` only mocks *tool* calls (this agent uses none) — the embedded
    # agent's run() still calls Claude for real, so a real model-request span
    # opens, the LLM runs for a few seconds, then the span closes — visible live.
    sandbox: mock
    max_iterations: 2
    persist_traces: all
    convergence:
      min_delta: 1.0e-6
      patience: 10
  reliability:
    metrics:
      - pass@1

dataset:
  cases_path: ../datasets/sentiment_live.jsonl

agent:
  entrypoint: selfevals.examples.sentiment_live:run

graders:
  # set_match: structured_output["detected"] (the predicted label) vs
  # expected.must_include (the gold label). threshold 1.0 = exact match.
  - type: set_match
    name: sentiment_set
    params: { gating: completeness, threshold: 1.0 }
  # deterministic: confirms the label string appears in the response content.
  - type: deterministic
    name: rules
